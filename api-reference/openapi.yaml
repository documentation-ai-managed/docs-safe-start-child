openapi: '3.0.0'
info:
  version: 1.0.0
  title: Safe Start Child API
  license:
    name: MIT
servers:
  - url: http://petstore.swagger.io/v1
paths:
  /children:
    get:
      summary: List all children
      operationId: listChildren
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
      responses:
        200:
          description: An paged array of children
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Children'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create child
      operationId: createChild
      responses:
        201:
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /children/{childId}:
    get:
      summary: Get child info
      operationId: showChildById
      parameters:
        - name: childId
          in: path
          required: true
          description: The id of the child to retrieve
          schema:
            type: string
      responses:
        200:
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Children'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Child:
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        guardian:
          type: string
    Children:
      type: array
      items:
        $ref: '#/components/schemas/Child'
    Error:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string